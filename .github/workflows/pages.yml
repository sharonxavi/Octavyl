# Builds the site as static files and publishes it to GitHub Pages on every push to main.
# One-time setup in the repo: Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - name: Build static site
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          # The site is served from /<repo name>; configure-pages reports that path.
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Optional: a form service URL (e.g. Formspree) so the contact form can send.
          # Add it under Settings > Secrets and variables > Actions > Variables.
          NEXT_PUBLIC_CONTACT_ENDPOINT: ${{ vars.CONTACT_ENDPOINT }}

      # Nested routes' prefetch files under the names the browser asks for.
      - run: node scripts/fix-export.mjs

      # No Jekyll: it would hide the _next folder.
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
